# STM32F103 target (Blue Pill / 最小系统板)
source [find target/stm32f1x.cfg]

# 复位说明（重要）：
# stm32f1x.cfg 对 ST-Link(hla) 默认使用 `reset_config srst_nogate`，即通过
# 调试器的 NRST 引脚复位。如果你的板子只接了 4 线 SWD（SWDIO/SWCLK/GND/3V3，
# 没有 NRST），烧录后的自动复位可能报 "timed out while waiting for target
# halted"。两种解决办法：
#
#   1. 把调试器的 RST 接到板子的 NRST 引脚（推荐，5 线）。
#   2. 在本文件取消下面一行的注释，改为软件复位（写 AIRCR 触发 SYSRESETREQ，
#      不依赖 NRST 引脚；烧录命令相应使用：cmake --build --preset debug
#      --target flash-soft-reset）：
#
# reset_config none
